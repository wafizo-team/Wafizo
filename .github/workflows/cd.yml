name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─── Build + Scan + Push ───────────────────────────────────────────────────
  build:
    name: Build · Scan · Push — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web, landing]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -f apps/${{ matrix.app }}/Dockerfile \
            -t ${{ env.IMAGE_PREFIX }}/wafizo-${{ matrix.app }}:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}/wafizo-${{ matrix.app }}:latest \
            .

      - name: Scan Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/wafizo-${{ matrix.app }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL
          trivyignores: .trivyignore

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Grype
        run: |
          grype ${{ env.IMAGE_PREFIX }}/wafizo-${{ matrix.app }}:${{ github.sha }} \
            --fail-on critical \
            --config .grype.yaml

      - name: Push image
        run: |
          docker push ${{ env.IMAGE_PREFIX }}/wafizo-${{ matrix.app }}:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}/wafizo-${{ matrix.app }}:latest

  # ─── Déploiement K3s ───────────────────────────────────────────────────────
  deploy:
    name: Deploy sur K3s
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Vérifier que le serveur est configuré
        id: check_server
        run: |
          if [ -z "${{ secrets.INSTANCE_IP }}" ]; then
            echo "INSTANCE_IP non configuré — déploiement ignoré"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Déployer sur K3s via SSH
        if: steps.check_server.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.INSTANCE_IP }}
          username: debian
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            kubectl set image deployment/api \
              api=ghcr.io/${{ github.repository_owner }}/wafizo-api:${{ github.sha }} \
              -n wafizo

            kubectl set image deployment/web \
              web=ghcr.io/${{ github.repository_owner }}/wafizo-web:${{ github.sha }} \
              -n wafizo

            kubectl set image deployment/landing \
              landing=ghcr.io/${{ github.repository_owner }}/wafizo-landing:${{ github.sha }} \
              -n wafizo

            kubectl rollout status deployment/api -n wafizo
            kubectl rollout status deployment/web -n wafizo
            kubectl rollout status deployment/landing -n wafizo
