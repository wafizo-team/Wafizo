---
# ─── Repo Helm ────────────────────────────────────────────────────────────────
- name: Ajouter le repo Helm cert-manager
  shell: helm repo add jetstack https://charts.jetstack.io || true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Mettre à jour les repos Helm
  shell: helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# ─── Installation cert-manager ────────────────────────────────────────────────
- name: Installer cert-manager via Helm
  shell: |
    helm upgrade --install cert-manager jetstack/cert-manager \
      --namespace cert-manager \
      --create-namespace \
      --set crds.enabled=true \
      --wait \
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# ─── ClusterIssuer Let's Encrypt ──────────────────────────────────────────────
- name: Créer le ClusterIssuer Let's Encrypt production
  shell: |
    kubectl apply -f - << 'MANIFEST'
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-prod
    spec:
      acme:
        server: https://acme-v02.api.letsencrypt.org/directory
        email: contact@wafizo.fr
        privateKeySecretRef:
          name: letsencrypt-prod
        solvers:
          - http01:
              ingress:
                class: traefik
    MANIFEST
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# ─── Vérification ─────────────────────────────────────────────────────────────
- name: Vérifier que cert-manager est running
  shell: kubectl get pods -n cert-manager
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: certmanager_status

- name: Afficher le statut cert-manager
  debug:
    msg: "{{ certmanager_status.stdout }}"
