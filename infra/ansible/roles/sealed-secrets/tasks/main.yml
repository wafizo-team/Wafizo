---
# ─── Installation Sealed Secrets ─────────────────────────────────────────────
- name: Ajouter le repo Helm Sealed Secrets
  shell: helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Mettre à jour les repos Helm
  shell: helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Installer Sealed Secrets via Helm
  shell: |
    helm upgrade --install sealed-secrets sealed-secrets/sealed-secrets \
      --namespace kube-system \
      --wait
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# ─── Installation kubeseal CLI ────────────────────────────────────────────────
- name: Télécharger kubeseal
  shell: |
    curl -sfL https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.26.0/kubeseal-0.26.0-linux-amd64.tar.gz \
    -o /tmp/kubeseal.tar.gz
  args:
    creates: /usr/local/bin/kubeseal

- name: Installer kubeseal
  shell: |
    tar -xzf /tmp/kubeseal.tar.gz -C /tmp
    mv /tmp/kubeseal /usr/local/bin/kubeseal
    chmod +x /usr/local/bin/kubeseal
  args:
    creates: /usr/local/bin/kubeseal

# ─── Vérification ─────────────────────────────────────────────────────────────
- name: Vérifier que Sealed Secrets est running
  shell: kubectl get pods -n kube-system | grep sealed-secrets
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: sealedsecrets_status

- name: Afficher le statut Sealed Secrets
  debug:
    msg: "{{ sealedsecrets_status.stdout }}"
