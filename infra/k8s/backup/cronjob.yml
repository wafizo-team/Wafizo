apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: wafizo
spec:
  schedule: "0 2 * * *"    # tous les jours à 2h du matin
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: postgres-backup
              image: postgres:16-alpine
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: wafizo-secrets
                      key: DATABASE_URL
                - name: BACKUP_DIR
                  value: "/backups"
              command:
                - /bin/sh
                - -c
                - |
                  DATE=$(date +%Y%m%d_%H%M%S)
                  pg_dump $DATABASE_URL > $BACKUP_DIR/wafizo_$DATE.sql
                  gzip $BACKUP_DIR/wafizo_$DATE.sql
                  # Garder uniquement les 7 derniers backups
                  ls -t $BACKUP_DIR/*.sql.gz | tail -n +8 | xargs rm -f
                  echo "Backup $DATE terminé"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          restartPolicy: OnFailure
          volumes:
            - name: backup-storage
              hostPath:
                path: /mnt/data/backups
                type: DirectoryOrCreate
