services:
  postgres:
    image: postgres:16-alpine
    container_name: wafizo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: wafizo
      POSTGRES_PASSWORD: wafizo
      POSTGRES_DB: wafizo_dev
    ports:
      - "5432:5432"
    volumes:
      - wafizo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wafizo -d wafizo_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wafizo-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - wafizo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wafizo-postgres-data:
  wafizo-redis-data:
