version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wafizo-db
    restart: always
    environment:
      POSTGRES_USER: wafizo
      POSTGRES_PASSWORD: wafizopassword
      POSTGRES_DB: wafizo_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wafizo-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
